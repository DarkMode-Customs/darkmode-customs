<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DarkMode Customs™ Status Admin</title>

  <style>
    :root {
      --bg: #02030a;
      --panel: rgba(8, 14, 32, 0.9);
      --text: #eff8ff;
      --muted: #91a8bc;
      --cyan: #59f7ff;
      --green: #6cffbd;
      --gold: #ffd36a;
      --red: #ff4f6d;
      --purple: #9f5cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(89, 247, 255, 0.18), transparent 32%),
        radial-gradient(circle at 84% 18%, rgba(159, 92, 255, 0.2), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(255, 79, 216, 0.12), transparent 40%),
        linear-gradient(180deg, #06101c, #02030a);
    }

    .panel {
      width: min(100%, 680px);
      padding: 32px;
      border: 1px solid rgba(89, 247, 255, 0.24);
      border-radius: 30px;
      background: var(--panel);
      box-shadow:
        0 0 80px rgba(89, 247, 255, 0.13),
        0 30px 90px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(24px);
    }

    .badge {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(89, 247, 255, 0.28);
      border-radius: 999px;
      color: var(--cyan);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(89, 247, 255, 0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: var(--cyan);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.74rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid rgba(89, 247, 255, 0.24);
      border-radius: 16px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      outline: none;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    button {
      min-height: 60px;
      border: 0;
      border-radius: 18px;
      color: #001216;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-3px);
    }

    .online {
      background: linear-gradient(135deg, var(--green), white);
    }

    .maintenance {
      background: linear-gradient(135deg, var(--gold), white);
    }

    .offline {
      background: linear-gradient(135deg, var(--red), white);
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid rgba(89, 247, 255, 0.16);
      border-radius: 16px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      white-space: pre-wrap;
      line-height: 1.5;
      min-height: 74px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--cyan);
      font-weight: 900;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="badge">DarkMode Customs™ Admin</div>

    <h1>Status Panel</h1>

    <p>
      Use this panel to update the live company status on the website and Discord.
      Keep your admin token private.
    </p>

    <label for="adminToken">Admin Token</label>
    <input
      id="adminToken"
      type="password"
      placeholder="Paste your Cloudflare ADMIN_TOKEN"
      autocomplete="off"
    />

    <label for="customMessage">Optional Custom Message</label>
    <textarea
      id="customMessage"
      placeholder="Leave blank to use the default status message."
    ></textarea>

    <div class="buttons">
      <button class="online" onclick="setStatus('online')">🟢 Online</button>
      <button class="maintenance" onclick="setStatus('maintenance')">🟡 Maintenance</button>
      <button class="offline" onclick="setStatus('offline')">🔴 Offline</button>
    </div>

    <div class="result" id="resultBox">
      Waiting for status update...
    </div>

    <a class="back-link" href="./index.html">← Back to Website</a>
  </main>

  <script>
    const WORKER_URL = "https://darkmode-customs-status.matthew-wellman.workers.dev/status";

    async function setStatus(status) {
      const token = document.getElementById("adminToken").value.trim();
      const customMessage = document.getElementById("customMessage").value.trim();
      const resultBox = document.getElementById("resultBox");

      if (!token) {
        resultBox.textContent = "Missing admin token.";
        return;
      }

      resultBox.textContent = "Updating status...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify({
            status,
            message: customMessage || undefined,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          resultBox.textContent = `Update failed:\n${JSON.stringify(data, null, 2)}`;
          return;
        }

        resultBox.textContent = `Status updated successfully:\n${JSON.stringify(data.status, null, 2)}`;
      } catch (error) {
        resultBox.textContent = `Connection error:\n${error.message}`;
      }
    }
  </script>
</body>
</html>
